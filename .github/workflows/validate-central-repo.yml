name: Validate central rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse JSON files
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          for path in pathlib.Path('.').rglob('*.json'):
              json.loads(path.read_text())
              print(f'valid json: {path}')
          PY

      - name: Validate scripts
        run: |
          bash -n scripts/bootstrap-project.sh
          bash -n scripts/remote-init.sh
          bash -n scripts/verify-project-registration.sh
          bash -n tests/test-bootstrap.sh
          python3 -m py_compile scripts/find-library.py

      - name: Verify required central files
        run: |
          test -f VERSION
          test -f AGENTS.md
          test -f LLM_START_HERE.md
          test -f governance/DEFINITION_OF_DONE.md
          test -f governance/REPOSITORY_MODEL.md
          test -f standards/quality/VIBE_CODING_QUALITY_RULEBOOK.md
          test -f standards/engineering/MODULAR_LIBRARY_STANDARD.md
          test -f standards/engineering/REUSE_FIRST_WORKFLOW.md
          test -f standards/documentation/LLM_DOCUMENTATION_STANDARD.md
          test -f playbooks/PROMOTE_CODE_TO_SHARED_LIBRARY.md
          test -f registry/libraries.json
          test -f schemas/library-catalog.schema.json
          test -f schemas/repository-map.schema.json
          test -f templates/project/.factory/project-context.json
          test -f templates/project/.factory/repository-map.json
          test -f templates/project/.factory/library-catalog.json
          test -f templates/project/docs/README.md
          test -f templates/project/docs/REUSABLE_COMPONENTS.md
          test -f templates/project/AGENTS.md
          test -f templates/project/CLAUDE.md
          test -f templates/project/GEMINI.md
          test -f templates/project/.cursor/rules/app-factory.mdc
          test -f templates/project/.github/copilot-instructions.md
          test -f schemas/project-context.schema.json

      - name: Test new and existing project registration
        run: bash tests/test-bootstrap.sh

      - name: Test empty library catalog search
        run: |
          if python3 scripts/find-library.py networking --catalog registry/libraries.json; then
            echo "Empty catalog unexpectedly returned a match" >&2
            exit 1
          fi
