[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-app-factory"
version = "0.5.0"
description = "Opt-in governance, handoff, and compliance tooling for the iOS App Factory"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
factory = "factory_cli.cli:main"

[tool.setuptools.packages.find]
include = ["factory_cli*"]
